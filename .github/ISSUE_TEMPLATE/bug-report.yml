name: Bug report
description: Report reproducible behavior in a supported installation.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, authorization URLs or codes, credential files, account identifiers,
        complete environment dumps, local paths, or model conversations. Report suspected security
        issues through the private link in SECURITY.md.
  - type: input
    id: package-version
    attributes:
      label: Package version or commit
      placeholder: 0.1.0-alpha.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: runtime-versions
    attributes:
      label: Node and DSH versions
      placeholder: Node 24.x; DSH 0.1.0-rc.7
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor report
      description: Paste only `doctor --json` after confirming it contains no private data.
      render: json
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use fake values and omit model content.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: real-account
    attributes:
      label: Was a real ChatGPT account involved?
      options:
        - "No"
        - "Yes, but no account or conversation data is included"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I confirmed that this report contains no credential, authorization, account, path, environment-dump, or conversation data.
          required: true
