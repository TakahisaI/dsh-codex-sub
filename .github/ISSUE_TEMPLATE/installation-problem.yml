name: Installation or compatibility problem
description: Ask for help with installation, startup, or a supported runtime combination.
title: "[Install] "
body:
  - type: markdown
    attributes:
      value: |
        This project supports only the combinations documented in compatibility.json.
        Do not paste auth URLs, tokens, auth.json, account IDs, full environment output, or local paths.
  - type: input
    id: package-version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Node version
      placeholder: macOS 15; Node 24.x
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH release
      placeholder: 0.1.0-rc.7
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor report
      description: Paste only `doctor --json` after confirming it contains no private data.
      render: json
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands and result
      description: Remove local paths and include only the smallest reproduction.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I confirmed that this report contains no credential, authorization, account, path, environment-dump, or conversation data.
          required: true
