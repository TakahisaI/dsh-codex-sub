# The trusted publisher for this exact workflow may stage a verified candidate, but cannot publish
# it directly. A maintainer must inspect and approve the staged package with two-factor
# authentication. The staging job consumes the original workflow artifact without rebuilding or
# repacking it.
name: Verify and stage release candidate

on:
  workflow_dispatch:

concurrency:
  group: dsh-codex-sub-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRUSTED_PUBLISHING_NPM_VERSION: 11.15.0

jobs:
  release-ref:
    name: Verify release ref
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "Release workflow must run from protected main." >&2
            exit 1
          fi

  source-checks:
    name: Source checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24
          - 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  candidate:
    name: Build candidate artifact
    needs:
      - release-ref
      - source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/release-artifact.mjs create --directory "$RUNNER_TEMP/release-artifact"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 7

  candidate-install:
    name: Candidate install (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 22.19.0
          - os: macos-latest
            node: 24
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - id: release-artifact
        run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
          --github-output
      - run: >-
          pnpm run test:packed-install --
          --package-tarball "${{ steps.release-artifact.outputs.package-tarball }}"

  compatibility-release:
    name: Exact release artifact (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 22.19.0
          - os: macos-latest
            node: 24
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - id: release-artifact
        run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
          --github-output
      - run: >-
          pnpm run test:exact-artifact-lane --
          --host-graph-mode locked-no-overrides
          --probe-scope request-contracts
          --package-tarball "${{ steps.release-artifact.outputs.package-tarball }}"
          --expected-sha256 "${{ steps.release-artifact.outputs.sha256 }}"

  candidate-ready:
    name: Candidate ready for staging
    needs:
      - candidate-install
      - compatibility-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"

  stage-publish:
    name: Stage exact candidate for maintainer approval
    needs: candidate-ready
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - id: release-artifact
        run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
          --github-output
      - name: Install the reviewed npm CLI
        run: >-
          npm install --global "npm@$TRUSTED_PUBLISHING_NPM_VERSION"
          --registry=https://registry.npmjs.org
      - name: Verify the npm CLI version
        run: test "$(npm --version)" = "$TRUSTED_PUBLISHING_NPM_VERSION"
      - name: Stage the exact candidate
        run: >-
          npm stage publish "${{ steps.release-artifact.outputs.package-tarball }}"
          --tag alpha
          --access public
          --registry=https://registry.npmjs.org
