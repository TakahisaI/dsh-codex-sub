# This workflow intentionally contains no npm authentication, OIDC permission, or publish command
# until the first package exists. A future trusted-publishing job must install the pinned npm CLI
# and consume this workflow artifact; it must not rebuild or repack the candidate.
name: Release gates (never publishes)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRUSTED_PUBLISHING_NPM_VERSION: 11.15.0

jobs:
  release-ref:
    name: Verify release ref
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "Release workflow must run from protected main." >&2
            exit 1
          fi

  source-checks:
    name: Source checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24
          - 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  candidate:
    name: Build candidate artifact
    needs:
      - release-ref
      - source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/release-artifact.mjs create --directory "$RUNNER_TEMP/release-artifact"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 7

  candidate-install:
    name: Candidate install (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 22.19.0
          - os: macos-latest
            node: 24
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - id: release-artifact
        run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
          --github-output
      - run: >-
          pnpm run test:packed-install --
          --package-tarball "${{ steps.release-artifact.outputs.package-tarball }}"

  candidate-ready:
    name: Candidate ready for manual approval (never publishes)
    needs: candidate-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
