name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24
          - 26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  candidate:
    name: Build candidate artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/release-artifact.mjs create --directory "$RUNNER_TEMP/release-artifact"
      - uses: actions/upload-artifact@v6
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 7

  packed-install:
    name: Packed install (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 26
          - os: macos-latest
            node: 22.19.0
          - os: macos-latest
            node: 24
          - os: macos-latest
            node: 26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - id: release-artifact
        run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
          --github-output
      - run: >-
          pnpm run test:packed-install --
          --package-tarball "${{ steps.release-artifact.outputs.package-tarball }}"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
