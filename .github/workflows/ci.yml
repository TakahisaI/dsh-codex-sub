name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-node-22-19:
    name: Node 22.19.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  check-node-24:
    name: Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  check-node-26:
    name: Node 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  candidate:
    name: Build candidate artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/release-artifact.mjs create --directory "$RUNNER_TEMP/release-artifact"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          retention-days: 7

  candidate-lane:
    name: DSH rc.1 candidate lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:candidate-lane

  packed-candidate-lane:
    name: Fresh packed workflow artifact on DSH 0.1.1-rc.1
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - id: release-artifact
        run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
          --github-output
      - run: >-
          pnpm run test:packed-candidate-lane --
          --host-graph-mode override-pinned
          --probe-scope credential-topology
          --package-tarball "${{ steps.release-artifact.outputs.package-tarball }}"
          --expected-sha256 "${{ steps.release-artifact.outputs.sha256 }}"

  exact-artifact-ubuntu-22-19:
    name: Exact workflow artifact (ubuntu-latest, Node 22.19.0)
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - id: release-artifact
        run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
          --github-output
      - run: >-
          pnpm run test:exact-artifact-lane --
          --host-graph-mode locked-no-overrides
          --probe-scope request-contracts
          --package-tarball "${{ steps.release-artifact.outputs.package-tarball }}"
          --expected-sha256 "${{ steps.release-artifact.outputs.sha256 }}"

  exact-artifact-ubuntu-24:
    name: Exact workflow artifact (ubuntu-latest, Node 24)
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dsh-codex-sub-unpublished
          path: ${{ runner.temp }}/release-artifact
      - id: release-artifact
        run: >-
          node scripts/release-artifact.mjs verify
          --directory "$RUNNER_TEMP/release-artifact"
          --github-output
      - run: >-
          pnpm run test:exact-artifact-lane --
          --host-graph-mode locked-no-overrides
          --probe-scope request-contracts
          --package-tarball "${{ steps.release-artifact.outputs.package-tarball }}"
          --expected-sha256 "${{ steps.release-artifact.outputs.sha256 }}"

  exact-artifact-ubuntu-26:
